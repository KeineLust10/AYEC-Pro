<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Bulut Enterprise</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        [v-cloak] {
            display: none !important;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #F8FAFC;
            margin: 0;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Menu Group Styles */
        .menu-group-header {
            cursor: pointer;
            transition: all 0.2s;
        }

        .menu-group-header:hover {
            background: #f8fafc;
        }

        .menu-group-items {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .menu-group-items.expanded {
            max-height: 500px;
        }
    </style>
</head>

<body class="h-screen overflow-hidden">
    <div id="app" v-cloak class="flex h-full w-full">

        <!-- SIDEBAR WITH GROUPED MENU -->
        <aside class="w-72 bg-white border-r border-slate-200 flex flex-col flex-shrink-0">
            <div class="h-16 flex items-center px-6 border-b border-slate-100">
                <div
                    class="w-10 h-10 bg-gradient-to-br from-blue-600 to-blue-700 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-lg">
                    B</div>
                <div class="ml-3">
                    <div class="font-bold text-lg leading-none">Bulut<span class="text-blue-600">Teknik</span></div>
                    <div class="text-[10px] text-slate-400 font-medium">Enterprise Panel</div>
                </div>
            </div>

            <nav class="flex-1 overflow-y-auto py-4 px-3">
                <!-- Dashboard -->
                <button @click="currentPage = 'dashboard'"
                    class="w-full flex items-center px-3 py-2.5 rounded-xl transition-all mb-2"
                    :class="currentPage === 'dashboard' ? 'bg-blue-50 text-blue-700 font-semibold shadow-sm' : 'text-slate-600 hover:bg-slate-50'">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"
                        :class="currentPage === 'dashboard' ? 'text-blue-600' : 'text-slate-400'"></i>
                    <span class="ml-3 text-sm">Genel Bakış</span>
                </button>

                <div class="h-px bg-slate-200 my-3"></div>

                <!-- Servis Yönetimi Group -->
                <div class="mb-2">
                    <div @click="toggleGroup('service')"
                        class="menu-group-header flex items-center justify-between px-3 py-2 rounded-lg">
                        <div class="flex items-center">
                            <i data-lucide="wrench" class="w-4 h-4 text-blue-600"></i>
                            <span class="ml-2 text-xs font-bold text-slate-700 uppercase tracking-wide">Servis
                                Yönetimi</span>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform"
                            :class="{'rotate-180': expandedGroups.service}"></i>
                    </div>
                    <div class="menu-group-items ml-4 mt-1" :class="{'expanded': expandedGroups.service}">
                        <button v-for="item in menuGroups.service" :key="item.id" @click="currentPage = item.id"
                            class="w-full flex items-center px-3 py-2 rounded-lg text-sm transition-all mb-1"
                            :class="currentPage === item.id ? 'bg-blue-50 text-blue-700 font-medium' : 'text-slate-600 hover:bg-slate-50'">
                            <i :data-lucide="item.icon" class="w-4 h-4 mr-2 opacity-60"></i>
                            {{ item.label }}
                        </button>
                    </div>
                </div>

                <!-- Müşteri Hub Group -->
                <div class="mb-2">
                    <div @click="toggleGroup('customer')"
                        class="menu-group-header flex items-center justify-between px-3 py-2 rounded-lg">
                        <div class="flex items-center">
                            <i data-lucide="users" class="w-4 h-4 text-emerald-600"></i>
                            <span class="ml-2 text-xs font-bold text-slate-700 uppercase tracking-wide">Müşteri
                                Hub</span>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform"
                            :class="{'rotate-180': expandedGroups.customer}"></i>
                    </div>
                    <div class="menu-group-items ml-4 mt-1" :class="{'expanded': expandedGroups.customer}">
                        <button v-for="item in menuGroups.customer" :key="item.id" @click="currentPage = item.id"
                            class="w-full flex items-center px-3 py-2 rounded-lg text-sm transition-all mb-1"
                            :class="currentPage === item.id ? 'bg-emerald-50 text-emerald-700 font-medium' : 'text-slate-600 hover:bg-slate-50'">
                            <i :data-lucide="item.icon" class="w-4 h-4 mr-2 opacity-60"></i>
                            {{ item.label }}
                        </button>
                    </div>
                </div>

                <div class="h-px bg-slate-200 my-3"></div>

                <!-- Stok & Satış Group -->
                <div class="mb-2">
                    <div @click="toggleGroup('stock')"
                        class="menu-group-header flex items-center justify-between px-3 py-2 rounded-lg">
                        <div class="flex items-center">
                            <i data-lucide="package" class="w-4 h-4 text-amber-600"></i>
                            <span class="ml-2 text-xs font-bold text-slate-700 uppercase tracking-wide">Stok &
                                Satış</span>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform"
                            :class="{'rotate-180': expandedGroups.stock}"></i>
                    </div>
                    <div class="menu-group-items ml-4 mt-1" :class="{'expanded': expandedGroups.stock}">
                        <button v-for="item in menuGroups.stock" :key="item.id" @click="currentPage = item.id"
                            class="w-full flex items-center px-3 py-2 rounded-lg text-sm transition-all mb-1"
                            :class="currentPage === item.id ? 'bg-amber-50 text-amber-700 font-medium' : 'text-slate-600 hover:bg-slate-50'">
                            <i :data-lucide="item.icon" class="w-4 h-4 mr-2 opacity-60"></i>
                            {{ item.label }}
                        </button>
                    </div>
                </div>

                <!-- Finans Group -->
                <div class="mb-2">
                    <div @click="toggleGroup('finance')"
                        class="menu-group-header flex items-center justify-between px-3 py-2 rounded-lg">
                        <div class="flex items-center">
                            <i data-lucide="wallet" class="w-4 h-4 text-indigo-600"></i>
                            <span class="ml-2 text-xs font-bold text-slate-700 uppercase tracking-wide">Finans</span>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform"
                            :class="{'rotate-180': expandedGroups.finance}"></i>
                    </div>
                    <div class="menu-group-items ml-4 mt-1" :class="{'expanded': expandedGroups.finance}">
                        <button v-for="item in menuGroups.finance" :key="item.id" @click="currentPage = item.id"
                            class="w-full flex items-center px-3 py-2 rounded-lg text-sm transition-all mb-1"
                            :class="currentPage === item.id ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-slate-600 hover:bg-slate-50'">
                            <i :data-lucide="item.icon" class="w-4 h-4 mr-2 opacity-60"></i>
                            {{ item.label }}
                        </button>
                    </div>
                </div>

                <div class="h-px bg-slate-200 my-3"></div>

                <!-- Araçlar Group -->
                <div class="mb-2">
                    <div @click="toggleGroup('tools')"
                        class="menu-group-header flex items-center justify-between px-3 py-2 rounded-lg">
                        <div class="flex items-center">
                            <i data-lucide="settings" class="w-4 h-4 text-slate-600"></i>
                            <span class="ml-2 text-xs font-bold text-slate-700 uppercase tracking-wide">Araçlar</span>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform"
                            :class="{'rotate-180': expandedGroups.tools}"></i>
                    </div>
                    <div class="menu-group-items ml-4 mt-1" :class="{'expanded': expandedGroups.tools}">
                        <button v-for="item in menuGroups.tools" :key="item.id" @click="currentPage = item.id"
                            class="w-full flex items-center px-3 py-2 rounded-lg text-sm transition-all mb-1"
                            :class="currentPage === item.id ? 'bg-slate-50 text-slate-700 font-medium' : 'text-slate-600 hover:bg-slate-50'">
                            <i :data-lucide="item.icon" class="w-4 h-4 mr-2 opacity-60"></i>
                            {{ item.label }}
                        </button>
                    </div>
                </div>

                <!-- İK & Personel Group -->
                <div class="mb-2">
                    <div @click="toggleGroup('hr')"
                        class="menu-group-header flex items-center justify-between px-3 py-2 rounded-lg">
                        <div class="flex items-center">
                            <i data-lucide="briefcase" class="w-4 h-4 text-purple-600"></i>
                            <span class="ml-2 text-xs font-bold text-slate-700 uppercase tracking-wide">İK &
                                Personel</span>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform"
                            :class="{'rotate-180': expandedGroups.hr}"></i>
                    </div>
                    <div class="menu-group-items ml-4 mt-1" :class="{'expanded': expandedGroups.hr}">
                        <button v-for="item in menuGroups.hr" :key="item.id" @click="currentPage = item.id"
                            class="w-full flex items-center px-3 py-2 rounded-lg text-sm transition-all mb-1"
                            :class="currentPage === item.id ? 'bg-purple-50 text-purple-700 font-medium' : 'text-slate-600 hover:bg-slate-50'">
                            <i :data-lucide="item.icon" class="w-4 h-4 mr-2 opacity-60"></i>
                            {{ item.label }}
                        </button>
                    </div>
                </div>
            </nav>

            <div class="p-4 border-t border-slate-100">
                <div
                    class="flex items-center p-3 rounded-xl bg-gradient-to-r from-slate-50 to-slate-100 border border-slate-200">
                    <div
                        class="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-sm">
                        AD</div>
                    <div class="ml-3 flex-1">
                        <div class="text-xs font-bold text-slate-700">Admin User</div>
                        <div class="text-[10px] text-slate-500">Yönetici</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT (Önceki içerik aynı kalacak, sadece menü değişti) -->
        <main class="flex-1 flex flex-col bg-[#F8FAFC] overflow-hidden">
            <header
                class="h-16 bg-white/90 backdrop-blur-lg border-b border-slate-200 flex items-center justify-between px-8">
                <h1 class="text-xl font-bold text-slate-800">{{ pageTitle }}</h1>
                <button
                    class="bg-gradient-to-r from-blue-600 to-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-lg">
                    <i data-lucide="plus" class="w-4 h-4 inline mr-2"></i>Yeni Ekle
                </button>
            </header>

            <div class="flex-1 overflow-auto p-8">
                <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center">
                    <h2 class="text-2xl font-bold text-slate-800 mb-4">{{ pageTitle }}</h2>
                    <p class="text-slate-600">Bu sayfa için içerik hazırlanıyor...</p>
                    <p class="text-xs text-slate-400 mt-2">Sayfa ID: {{ currentPage }}</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    currentPage: 'dashboard',
                    expandedGroups: {
                        service: true,
                        customer: false,
                        stock: false,
                        finance: false,
                        tools: false,
                        hr: false
                    },
                    menuGroups: {
                        service: [
                            { id: 'kanban', label: 'İş Emirleri (Pano)', icon: 'clipboard-list' },
                            { id: 'service-status', label: 'Durum Ekranı', icon: 'monitor' },
                            { id: 'technician', label: 'Teknisyen Paneli', icon: 'tool' },
                            { id: 'external-tracking', label: 'Lojistik & Garanti', icon: 'truck' },
                            { id: 'field-service', label: 'Saha Haritası', icon: 'map-pin' },
                            { id: 'appointments', label: 'Randevular', icon: 'calendar' },
                            { id: 'new-transaction', label: 'Yeni İşlem', icon: 'plus-circle' }
                        ],
                        customer: [
                            { id: 'customers', label: 'Müşteri Listesi', icon: 'users' },
                            { id: 'contracts', label: 'Sözleşmeler', icon: 'file-text' },
                            { id: 'reminders', label: 'Hatırlatıcılar', icon: 'bell' },
                            { id: 'announcements', label: 'Duyurular', icon: 'megaphone' }
                        ],
                        stock: [
                            { id: 'stock', label: 'Stok Yönetimi', icon: 'package' },
                            { id: 'pos', label: 'Hızlı Satış (POS)', icon: 'shopping-cart' },
                            { id: 'service-definitions', label: 'Hizmet Tanımları', icon: 'tag' }
                        ],
                        finance: [
                            { id: 'accounting', label: 'Gelir / Gider', icon: 'dollar-sign' },
                            { id: 'reports', label: 'Raporlar', icon: 'bar-chart-2' }
                        ],
                        tools: [
                            { id: 'ai-assistant', label: 'AI Asistan', icon: 'bot' },
                            { id: 'knowledge-base', label: 'Bilgi Bankası', icon: 'book-open' },
                            { id: 'settings', label: 'Ayarlar', icon: 'settings' },
                            { id: 'audit-log', label: 'Log Kayıtları', icon: 'file-search' },
                            { id: 'support', label: 'Destek', icon: 'help-circle' }
                        ],
                        hr: [
                            { id: 'personnel', label: 'Personel', icon: 'user-check' }
                        ]
                    }
                }
            },
            computed: {
                pageTitle() {
                    if (this.currentPage === 'dashboard') return 'Genel Bakış'

                    for (const group in this.menuGroups) {
                        const item = this.menuGroups[group].find(i => i.id === this.currentPage)
                        if (item) return item.label
                    }

                    return 'Panel'
                }
            },
            methods: {
                toggleGroup(groupName) {
                    this.expandedGroups[groupName] = !this.expandedGroups[groupName]
                }
            },
            mounted() {
                lucide.createIcons()
            },
            updated() {
                lucide.createIcons()
            }
        }).mount('#app')
    </script>
</body>

</html>
