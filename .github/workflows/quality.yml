name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest PyQt6
      - name: Mojibake guard
        run: python tools/mojibake_guard.py
      - name: ASCII diff guard
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git fetch origin "${{ github.base_ref }}" --depth=1
            python tools/ascii_diff_guard.py --base "origin/${{ github.base_ref }}"
          } else {
            python tools/ascii_diff_guard.py --base "HEAD~1"
          }
      - name: Focused tests
        run: pytest tests/test_mojibake_guard.py tests/test_dialog_flows.py -q
